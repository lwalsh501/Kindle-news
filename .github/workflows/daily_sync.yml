name: Daily Instapaper News Sync

on:
  push:              # Forces GitHub to index the workflow and run on save
  workflow_dispatch: # Enables the manual "Run workflow" button
  schedule:
    # Runs at 20:30 UTC = 6:30 AM AEST (Melbourne/Sydney winter)
    - cron: '30 20 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Curator Script
        env:
          INSTAPAPER_USERNAME: ${{ secrets.INSTAPAPER_USERNAME }}
          INSTAPAPER_PASSWORD: ${{ secrets.INSTAPAPER_PASSWORD }}
          INSTAPAPER_KEY: ${{ secrets.INSTAPAPER_KEY }}
          INSTAPAPER_SECRET: ${{ secrets.INSTAPAPER_SECRET }}
          LEMONDE_USERNAME: ${{ secrets.LEMONDE_USERNAME }}
          LEMONDE_PASSWORD: ${{ secrets.LEMONDE_PASSWORD }}
          FT_USERNAME: ${{ secrets.FT_USERNAME }}
          FT_PASSWORD: ${{ secrets.FT_PASSWORD }}
          FT_COOKIE: ${{ secrets.FT_COOKIE }}
          ECONOMIST_COOKIE: ${{ secrets.ECONOMIST_COOKIE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python sync_to_instapaper.py --auto

      - name: Run Cleanup Script (2-Day Expiration)
        env:
          INSTAPAPER_USERNAME: ${{ secrets.INSTAPAPER_USERNAME }}
          INSTAPAPER_PASSWORD: ${{ secrets.INSTAPAPER_PASSWORD }}
          INSTAPAPER_KEY: ${{ secrets.INSTAPAPER_KEY }}
          INSTAPAPER_SECRET: ${{ secrets.INSTAPAPER_SECRET }}
        run: python cleanup_instapaper.py

      - name: Update GitHub Pages Web Dashboard
        env:
          INSTAPAPER_USERNAME: ${{ secrets.INSTAPAPER_USERNAME }}
          INSTAPAPER_PASSWORD: ${{ secrets.INSTAPAPER_PASSWORD }}
          INSTAPAPER_KEY: ${{ secrets.INSTAPAPER_KEY }}
          INSTAPAPER_SECRET: ${{ secrets.INSTAPAPER_SECRET }}
        run: python generate_web_dashboard.py

      - name: Commit & Push Dashboard Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to docs/data.json"
          else
            git commit -m "Auto-update web dashboard [skip ci]"
            git push
          fi
